name: ADE Remote PR Monitor

on:
  push:
    branches:
      - main
    paths:
      - ".autodev/runtime/remote-execution.json"
  repository_dispatch:
    types:
      - ade_remote_pr_monitor
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ade-remote-pr-monitor-${{ github.event.client_payload.project_key || 'default' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.control_ref || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Observe remote PR and advance Campaign
        env:
          PYTHONPATH: src
          ADE_CONTROL_REF: ${{ github.event.client_payload.control_ref || 'main' }}
          ADE_PROJECT_KEY: ${{ github.event.client_payload.project_key || 'default' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADE_TARGET_GITHUB_TOKEN: ${{ secrets.ADE_TARGET_GITHUB_TOKEN }}
        run: python .github/trusted/remote_pr_monitor.py

      - name: Upload remote monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-remote-pr-monitor-result
          path: .autodev/runtime/remote-monitor-result.json
          if-no-files-found: error
          retention-days: 30
