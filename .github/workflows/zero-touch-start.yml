name: ADE Zero-Touch Start

on:
  push:
    branches:
      - main
      - ade-jichi-insight
      - ade-jquants
      - ade-chu-kei
    paths:
      - ".autodev/accepted-plan.json"
  repository_dispatch:
    types:
      - ade_zero_touch_start
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ade-zero-touch-start-${{ github.event.client_payload.project_key || github.event.client_payload.control_ref || github.ref_name || 'default' }}
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load project state from control branch
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_REF="${{ github.event.client_payload.control_ref || github.ref_name || 'main' }}"
          if [ "$CONTROL_REF" != "main" ]; then
            git fetch --depth=1 origin "$CONTROL_REF"
            git checkout FETCH_HEAD -- .autodev
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate and dispatch eligible Campaign
        env:
          ADE_CONTROL_REF: ${{ github.event.client_payload.control_ref || github.ref_name || 'main' }}
          ADE_PROJECT_KEY: ${{ github.event.client_payload.project_key || github.event.client_payload.control_ref || github.ref_name || 'default' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/trusted/zero_touch_start.py

      - name: Upload zero-touch decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-zero-touch-start-result
          path: .autodev/runtime/zero-touch-start-result.json
          if-no-files-found: error
          retention-days: 30
