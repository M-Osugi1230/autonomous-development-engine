<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ADE Progress</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--line:#2a3858;--text:#eef4ff;--muted:#9baac5;--good:#58d68d;--warn:#f4c95d;--bad:#ff7b8a;--accent:#79a7ff;--shadow:0 14px 36px rgba(0,0,0,.22)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 10% 0,#17213a 0,transparent 32%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
.shell{max-width:1080px;margin:0 auto;padding:22px 16px calc(56px + env(safe-area-inset-bottom))}.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;margin-bottom:10px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:800}.top h1{margin:5px 0 5px;font-size:clamp(28px,6vw,44px);line-height:1}.sub{font-size:13px;color:var(--muted);line-height:1.5}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#18223b;color:var(--text);padding:9px 12px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;min-height:40px;touch-action:manipulation}.button:hover,.button:focus-visible{border-color:var(--accent)}.button.primary{background:#1b2d52;border-color:#35558f}.button:disabled{opacity:.5;cursor:not-allowed}
.overview{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:14px 0 20px;color:var(--muted);font-size:13px}.overview strong{color:var(--text);font-size:14px}.notice{padding:10px 12px;border-radius:10px;border:1px solid #6d5b2d;background:#2b2413;color:#f6df9e;font-size:13px;line-height:1.5;margin:10px 0 18px}.notice[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(180deg,rgba(24,34,59,.96),rgba(15,23,41,.98));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden}.card.alert{border-color:#725a2d}.card.failed{border-color:#7b3d48}.project-summary{list-style:none;cursor:pointer;padding:15px;min-height:52px;display:flex;align-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.project-summary::-webkit-details-marker{display:none}.project-summary::marker{content:""}.project-summary:hover,.project-summary:focus-visible{background:rgba(121,167,255,.06);outline:none}.project-name{font-size:19px;font-weight:800;line-height:1.25}.project-card[open] .project-summary{border-bottom:1px solid #263452}.card-content{padding:12px 15px 15px}.status-row{display:flex;justify-content:flex-end;min-height:26px}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}.pill.ACTIVE{color:#bcd2ff;border-color:#35558f;background:#172b50}.pill.MONITORING{color:#d5c8ff;border-color:#5c4f86;background:#241d40}.pill.COMPLETED{color:#b8f2ce;border-color:#2d6c48;background:#123323}.pill.STALE,.pill.BLOCKED{color:#ffe3a2;border-color:#7b6333;background:#342a12}.pill.STOPPED{color:#ffc1c7;border-color:#7b3d48;background:#35171d}.pill.IDLE,.pill.UNKNOWN{color:#c8d0df}.progress-head{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin:8px 0 6px}.progress{height:6px;background:#090e19;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#79a7ff,#9d86ff);width:0}.body{display:grid;gap:11px;margin-top:15px}.item{border-top:1px solid #2a3858;padding-top:10px}.item:first-child{border-top:0;padding-top:0}.label{display:block;color:var(--muted);font-size:10px;font-weight:800;margin-bottom:4px}.value{font-size:13px;line-height:1.55}.value strong{font-size:14px}.time{color:var(--muted)}.warning{margin-top:12px;border:1px solid #6d5b2d;background:#2b2413;color:#f6df9e;border-radius:9px;padding:9px 10px;font-size:12px;line-height:1.5}.error{margin-top:12px;border:1px solid #7b3d48;background:#35171d;color:#ffc1c7;border-radius:9px;padding:9px 10px;font-size:12px;line-height:1.5}.more{margin-top:12px;border-top:1px solid #263452;padding-top:9px}.more summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:700;touch-action:manipulation}.details{display:grid;gap:7px;padding-top:10px;font-size:12px;line-height:1.5}.details b{color:var(--muted);font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.footer{margin-top:22px;color:var(--muted);font-size:11px;line-height:1.6;text-align:center}
@media(max-width:900px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.top-actions{width:100%}.top-actions .button{flex:1}}@media(max-width:620px){.shell{padding:18px 12px calc(50px + env(safe-area-inset-bottom))}.overview{align-items:flex-start;flex-direction:column}.project-summary{padding:14px}.card-content{padding:12px 14px 14px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="eyebrow">Autonomous Development Engine</div><h1>ADE Progress</h1><div class="sub">進捗確認専用。指示・再開・新しいGoalはこのチャットから行います。</div></div><div class="top-actions"><button type="button" class="button primary" id="refreshButton">最新状態を取得</button></div></header>
<div class="overview"><strong id="overviewText">読み込み中...</strong><span id="lastUpdated">—</span></div>
<div class="notice" id="statusNotice" hidden></div>
<section class="grid" id="projectGrid"></section>
<div class="footer">プロジェクト名をタップすると開閉できます。5分ごとに自動更新します。</div>
</main>
<script>
const state={data:null,busy:false};
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const COLLAPSE_STORAGE_KEY="ade-progress-collapsed-projects";
const CAMPAIGN_SUMMARIES={
  "jquants-production-materialization-001":"J-Quants Research Studioの本番分析基盤を完成させる",
  "chukei-plan-detection-scale-campaign-004":"中期経営計画の一次情報候補を安全に拡大する",
  "jichi-phase15-akita-candidate-campaign-001":"秋田市の非公開レビュー候補データを作成する"
};
const ACTIVITY_LABELS={ACTIVE:"稼働中",MONITORING:"監視中",STALE:"停滞の可能性",BLOCKED:"判断待ち",STOPPED:"停止",COMPLETED:"完了",IDLE:"待機",UNKNOWN:"不明"};
function collapsedProjects(){try{const raw=JSON.parse(localStorage.getItem(COLLAPSE_STORAGE_KEY)||"[]");return new Set(Array.isArray(raw)?raw.filter(v=>typeof v==="string"):[])}catch{return new Set()}}
function saveCollapsedProjects(values){try{localStorage.setItem(COLLAPSE_STORAGE_KEY,JSON.stringify([...values]))}catch{}}
function bindProjectToggles(){document.querySelectorAll("details.project-card").forEach(card=>card.addEventListener("toggle",()=>{const key=card.dataset.project;if(!key)return;const collapsed=collapsedProjects();if(card.open)collapsed.delete(key);else collapsed.add(key);saveCollapsedProjects(collapsed)}))}
function progress(p){return p.total_count?Math.max(0,Math.min(100,Math.round(p.completed_count/p.total_count*100))):0}
function firstSentence(text){const s=String(text||"").trim();if(!s)return "Goal未設定";const parts=s.split(/(?<=[。.!?])\s+/);return (parts[0]||s).slice(0,180)}
function goalHeadline(p){return CAMPAIGN_SUMMARIES[p.campaign_id]||firstSentence(p.goal)}
function relativeTime(value){if(!value)return "更新時刻を取得できません";const t=new Date(value);if(Number.isNaN(t.getTime()))return "更新時刻を取得できません";const sec=Math.max(0,Math.floor((Date.now()-t.getTime())/1000));if(sec<60)return "たった今";if(sec<3600)return `${Math.floor(sec/60)}分前`;if(sec<86400)return `${Math.floor(sec/3600)}時間前`;return `${Math.floor(sec/86400)}日前`}
function fullTime(value){if(!value)return "—";const t=new Date(value);return Number.isNaN(t.getTime())?"—":t.toLocaleString("ja-JP")}
function positionText(p){if(p.activity==="COMPLETED")return "このGoalは完了しています。";if(p.activity==="BLOCKED")return "人間の判断待ちで停止しています。";if(p.activity==="STOPPED")return "失敗を検出して停止しています。";if(p.activity==="STALE")return "実行中の記録ですが、状態更新が止まっています。";if(p.next_system_action==="monitor-provider-session")return "実装エージェントの結果を監視しています。";if(p.next_system_action==="continue-trusted-execution")return "次の実行ステップを進めています。";if(p.current_task_id)return "現在のタスクを処理しています。";return p.activity==="IDLE"?"次のGoalを待っています。":"状態を確認しています。"}
function taskPosition(p){if(!p.total_count)return "—";if(p.activity==="COMPLETED")return `${p.total_count} / ${p.total_count}`;const n=Math.min(p.total_count,Math.max(1,p.completed_count+1));return `${n} / ${p.total_count}`}
function renderOverview(projects){const active=projects.filter(p=>["ACTIVE","MONITORING"].includes(p.activity)).length,attention=projects.filter(p=>["STALE","BLOCKED","STOPPED","UNKNOWN"].includes(p.activity)).length,completed=projects.filter(p=>p.activity==="COMPLETED").length;$("overviewText").textContent=`稼働 ${active} ・ 要確認 ${attention} ・ 完了 ${completed}`}
function render(){if(!state.data)return;const projects=state.data.projects||[],collapsed=collapsedProjects();renderOverview(projects);const errors=state.data.errors||[];$("statusNotice").hidden=errors.length===0;if(errors.length)$("statusNotice").textContent="一部プロジェクトの状態取得に失敗しています。";$("projectGrid").innerHTML=projects.map(p=>{const pct=progress(p),activity=p.activity||"UNKNOWN",cardClass=["STALE","BLOCKED"].includes(activity)?"alert":activity==="STOPPED"?"failed":"",run=p.implementation_run||{},open=collapsed.has(p.key)?"":" open";return `<details class="card project-card ${cardClass}" data-project="${esc(p.key)}"${open}><summary class="project-summary"><span class="project-name">${esc(p.label)}</span></summary><div class="card-content"><div class="status-row"><span class="pill ${esc(activity)}">${esc(ACTIVITY_LABELS[activity]||activity)}</span></div><div class="progress-head"><span>Task ${esc(taskPosition(p))}</span><span>${p.total_count?`${pct}%`:`—`}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="body"><div class="item"><span class="label">GOAL</span><div class="value"><strong>${esc(goalHeadline(p))}</strong></div></div><div class="item"><span class="label">現在地</span><div class="value">${esc(positionText(p))}</div></div><div class="item"><span class="label">最終変化</span><div class="value time">${esc(relativeTime(p.last_state_change_at))}</div></div></div>${activity==="STALE"?`<div class="warning">6時間以上、ADEの状態更新を確認できていません。チャットで状況確認・再開を指示してください。</div>`:""}${activity==="BLOCKED"?`<div class="warning">人間の判断が必要です。内容はチャットで確認してください。</div>`:""}${activity==="STOPPED"?`<div class="error">失敗を検出しています。チャットで原因確認を指示してください。</div>`:""}<details class="more"><summary>詳細を見る</summary><div class="details"><div><b>完了:</b> ${esc(p.completed_count)} / ${esc(p.total_count||"?")}</div><div><b>Current Task:</b> <span class="mono">${esc(p.current_task_id||"—")}</span></div><div><b>Next:</b> <span class="mono">${esc(p.next_system_action||"—")}</span></div><div><b>Failures:</b> ${esc(p.failed_count)}</div><div><b>State更新:</b> ${esc(fullTime(p.last_state_change_at))}</div><div><b>Workflow:</b> ${esc(run.name||"—")} / ${esc(run.status||"—")}${run.conclusion?` / ${esc(run.conclusion)}`:""}</div></div></details></div></details>`}).join("");bindProjectToggles();$("lastUpdated").textContent="取得 "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
async function loadStatus(){if(state.busy)return;state.busy=true;$("refreshButton").disabled=true;try{const r=await fetch("/api/status",{cache:"no-store"}),data=await r.json();if(!r.ok)throw new Error(data.message||data.error||"status error");state.data=data;render()}catch(e){$("statusNotice").hidden=false;$("statusNotice").textContent="状態取得に失敗しました: "+e.message}finally{state.busy=false;$("refreshButton").disabled=false}}
$("refreshButton").addEventListener("click",loadStatus);loadStatus();setInterval(loadStatus,300000);
</script>
</body>
</html>
