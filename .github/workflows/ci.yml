name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m compileall -q src scripts tests .github/trusted

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Trusted DAG dispatch proof
        run: python .github/trusted/dag_dispatch_probe.py

      - name: Multi-provider routing proof
        env:
          PYTHONPATH: src
        run: python scripts/multi_provider_probe.py
