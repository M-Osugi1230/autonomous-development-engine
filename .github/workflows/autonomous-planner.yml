name: ADE Autonomous Planner

on:
  push:
    branches:
      - main
      - ade-jichi-insight
      - ade-jquants
      - ade-chu-kei
    paths:
      - ".autodev/planning-goal.json"
      - ".autodev/completion-goal.json"
  repository_dispatch:
    types:
      - ade_planner_retry
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ade-autonomous-planner-${{ github.event.client_payload.project_key || github.ref_name || 'default' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.control_ref || github.ref_name || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Plan Goal through trusted boundary
        env:
          PYTHONPATH: src
          ADE_CONTROL_REF: ${{ github.event.client_payload.control_ref || github.ref_name || 'main' }}
          ADE_PROJECT_KEY: ${{ github.event.client_payload.project_key || github.ref_name || 'default' }}
          ADE_REPOSITORY_INTELLIGENCE_PREFIXES: operations/plan-detection,operations/research-priority,operations/source-research,scripts,docs
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADE_TARGET_GITHUB_TOKEN: ${{ secrets.ADE_TARGET_GITHUB_TOKEN }}
        run: python .github/trusted/completion_planner_cycle.py

      - name: Upload planner decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-autonomous-planner-result
          path: .autodev/runtime/autonomous-planner-result.json
          if-no-files-found: error
          retention-days: 30
