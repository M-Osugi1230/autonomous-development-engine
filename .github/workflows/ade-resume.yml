name: ADE Resume Watch

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [ade_resume_watch]
  push:
    branches: [main]
    paths:
      - ".github/workflows/ade-resume.yml"
      - ".github/trusted/provider_resume.py"
      - ".github/trusted/provider_cycle.py"
      - "src/ade/production_provider_broker.py"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: ade-jules-cycle-${{ github.event.client_payload.project_key || github.event.client_payload.control_ref || 'default' }}
  cancel-in-progress: false

jobs:
  resume:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.control_ref || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resume eligible checkpoint
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ADE_ENABLE_COPILOT_FALLBACK: ${{ vars.ADE_ENABLE_COPILOT_FALLBACK }}
          ADE_CONTROL_REF: ${{ github.event.client_payload.control_ref || 'main' }}
          ADE_PROJECT_KEY: ${{ github.event.client_payload.project_key || github.event.client_payload.control_ref || 'default' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADE_GITHUB_OWNER: M-Osugi1230
          ADE_GITHUB_REPO: autonomous-development-engine
          ADE_JULES_DAILY_TASK_LIMIT: "15"
        run: python .github/trusted/provider_resume.py

      - name: Upload resume result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-resume-result
          path: .autodev/runtime/jules-session.json
          if-no-files-found: ignore

  scheduled-project-resume:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        control_ref:
          - main
          - ade-jichi-insight
          - ade-jquants
          - ade-chu-kei
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project controller
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.control_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resume eligible project checkpoint
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ADE_ENABLE_COPILOT_FALLBACK: ${{ vars.ADE_ENABLE_COPILOT_FALLBACK }}
          ADE_CONTROL_REF: ${{ matrix.control_ref }}
          ADE_PROJECT_KEY: ${{ matrix.control_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADE_GITHUB_OWNER: M-Osugi1230
          ADE_GITHUB_REPO: autonomous-development-engine
          ADE_JULES_DAILY_TASK_LIMIT: "15"
        run: python .github/trusted/provider_resume.py

      - name: Upload project resume result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-resume-result-${{ matrix.control_ref }}
          path: .autodev/runtime/jules-session.json
          if-no-files-found: ignore
