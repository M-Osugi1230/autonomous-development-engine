name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m compileall -q src scripts tests .github/trusted

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Trusted DAG dispatch proof
        run: python .github/trusted/dag_dispatch_probe.py

      - name: Execution lease duplicate-dispatch proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/execution_lease_probe.py

      - name: Zero-Touch Start proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/zero_touch_start_probe.py

      - name: Autonomous Planner proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/autonomous_planner_probe.py

      - name: Jules Planner Adapter proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/jules_planner_adapter_probe.py

      - name: Autonomous Planner activation proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/autonomous_planner_cycle_probe.py

      - name: Autonomous Planner capacity retry proof
        env:
          PYTHONPATH: src:.github/trusted
        run: python .github/trusted/autonomous_planner_retry_probe.py

      - name: Repository Intelligence proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/repository_intelligence_probe.py

      - name: Runtime Verification post-merge trigger proof
        env:
          PYTHONPATH: src:.github/trusted
        run: python .github/trusted/runtime_verification_trigger_probe.py

      - name: Runtime Verification bounded execution proof
        env:
          PYTHONPATH: src:.github/trusted
        run: python .github/trusted/runtime_probe_executor_probe.py

      - name: Remote Repository Loop proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/remote_execution_probe.py

      - name: Production fault-injection proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/fault_injection_probe.py

      - name: Long-running campaign restart proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/long_run_campaign_probe.py

      - name: Mission Control observability proof
        env:
          PYTHONPATH: src
        run: python scripts/mission_control_probe.py

      - name: Autonomous recovery fault proof
        env:
          PYTHONPATH: src
        run: python scripts/recovery_fault_probe.py

      - name: Multi-provider routing proof
        env:
          PYTHONPATH: src
        run: python scripts/multi_provider_probe.py

      - name: Checkpoint restart proof
        env:
          PYTHONPATH: src
        run: python scripts/checkpoint_resume_probe.py

      - name: Human decision boundary proof
        env:
          PYTHONPATH: src
        run: python scripts/human_decision_probe.py

      - name: Production Graduation audit
        env:
          PYTHONPATH: src
        run: python scripts/graduation_audit.py

      - name: ADE v1.1 Zero-Touch Graduation audit
        env:
          PYTHONPATH: src
        run: python scripts/v1_1_zero_touch_audit.py

      - name: ADE v1.2 Autonomous Planner Graduation audit
        env:
          PYTHONPATH: src
        run: python scripts/v1_2_autonomous_planner_audit.py

      - name: ADE v1.3 Repository Intelligence Graduation audit
        env:
          PYTHONPATH: src
        run: python scripts/v1_3_repository_intelligence_audit.py
