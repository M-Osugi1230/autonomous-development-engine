name: ADE Jules Cycle

on:
  repository_dispatch:
    types:
      - ade_next_cycle
  push:
    branches:
      - main
    paths:
      - ".autodev/pilot/dispatch.json"

permissions:
  contents: write

concurrency:
  group: ade-jules-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start and monitor Jules coding session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADE_GITHUB_OWNER: M-Osugi1230
          ADE_GITHUB_REPO: ${{ github.event_name == 'push' && 'one-minute-thought-experiments' || 'autonomous-development-engine' }}
          ADE_JULES_DAILY_TASK_LIMIT: "15"
        run: python .github/trusted/jules_cycle.py

      - name: Upload cycle result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-jules-cycle-result
          path: .autodev/runtime/jules-session.json
          if-no-files-found: warn
