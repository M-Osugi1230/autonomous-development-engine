name: ADE Autonomous Planner

on:
  push:
    branches:
      - main
    paths:
      - ".autodev/planning-goal.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ade-autonomous-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Plan Goal through trusted boundary
        env:
          PYTHONPATH: src
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/trusted/autonomous_planner_cycle.py

      - name: Upload planner decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-autonomous-planner-result
          path: .autodev/runtime/autonomous-planner-result.json
          if-no-files-found: error
          retention-days: 30
