name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m compileall -q src scripts tests .github/trusted

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Trusted DAG dispatch proof
        run: python .github/trusted/dag_dispatch_probe.py

      - name: Execution lease duplicate-dispatch proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/execution_lease_probe.py

      - name: Zero-Touch Start proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/zero_touch_start_probe.py

      - name: Autonomous Planner proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/autonomous_planner_probe.py

      - name: Jules Planner Adapter proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/jules_planner_adapter_probe.py

      - name: Autonomous Planner activation proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/autonomous_planner_cycle_probe.py

      - name: Autonomous Planner capacity retry proof
        env:
          PYTHONPATH: src:.github/trusted
        run: python .github/trusted/autonomous_planner_retry_probe.py

      - name: Repository Intelligence proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/repository_intelligence_probe.py

      - name: Development Memory proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/development_memory_probe.py

      - name: Development Memory extraction proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/development_memory_extraction_probe.py

      - name: Development Memory resolution proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/development_memory_resolution_probe.py

      - name: Development Memory retrieval proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/development_memory_retrieval_probe.py

      - name: Development Memory planner integration proof
        env:
          PYTHONPATH: src
        run: python .github/trusted/development_memory_planner_integration_probe.py

      - name: Development Memory feedback lifecycle proof
        env:
