name: ADE Provider Cycle

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - ade_next_cycle

permissions:
  contents: write

concurrency:
  group: ade-jules-cycle-${{ github.event.client_payload.project_key || github.event.client_payload.control_ref || 'default' }}
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load project state from control branch
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_REF="${{ github.event.client_payload.control_ref || 'main' }}"
          if [ "$CONTROL_REF" != "main" ]; then
            git fetch --depth=1 origin "$CONTROL_REF"
            git checkout FETCH_HEAD -- .autodev
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Route and monitor coding provider session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ADE_ENABLE_COPILOT_FALLBACK: ${{ vars.ADE_ENABLE_COPILOT_FALLBACK }}
          ADE_CONTROL_REF: ${{ github.event.client_payload.control_ref || 'main' }}
          ADE_PROJECT_KEY: ${{ github.event.client_payload.project_key || github.event.client_payload.control_ref || 'default' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADE_GITHUB_OWNER: M-Osugi1230
          ADE_GITHUB_REPO: autonomous-development-engine
          ADE_JULES_DAILY_TASK_LIMIT: "15"
        run: python .github/trusted/provider_cycle.py

      - name: Upload cycle result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-provider-cycle-result
          path: .autodev/runtime/jules-session.json
          if-no-files-found: warn
