name: ADE Runtime Verification

on:
  repository_dispatch:
    types:
      - ade_runtime_verification

permissions:
  contents: write

concurrency:
  group: ade-runtime-verification-${{ github.event.client_payload.project_key || github.event.client_payload.control_ref || 'default' }}-${{ github.event.client_payload.verification_id }}
  cancel-in-progress: false

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Load project state from control branch
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_REF="${{ github.event.client_payload.control_ref || 'main' }}"
          if [ "$CONTROL_REF" != "main" ]; then
            git fetch --depth=1 origin "$CONTROL_REF"
            git checkout FETCH_HEAD -- .autodev
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate durable runtime verification receipt
        env:
          PYTHONPATH: src:.github/trusted
          ADE_CONTROL_REF: ${{ github.event.client_payload.control_ref || 'main' }}
          ADE_PROJECT_KEY: ${{ github.event.client_payload.project_key || github.event.client_payload.control_ref || 'default' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADE_TARGET_GITHUB_TOKEN: ${{ secrets.ADE_TARGET_GITHUB_TOKEN }}
        run: python .github/trusted/runtime_verification_dispatch_targeted.py

      - name: Upload runtime verification dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ade-runtime-verification-dispatch-result
          path: .autodev/runtime/runtime-verification-dispatch-result.json
          if-no-files-found: error
          retention-days: 30
