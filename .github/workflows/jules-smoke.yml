name: Jules Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".autodev/jules-smoke-trigger.txt"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Jules authentication and repository visibility
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          ADE_GITHUB_OWNER: M-Osugi1230
          ADE_GITHUB_REPO: autonomous-development-engine
        run: python .github/trusted/jules_smoke.py
